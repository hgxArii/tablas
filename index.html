
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mundo de Multiplicaciones</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js" defer></script>
</head>
<body>

    <main class="contenedor">
        <header class="encabezado">
            <span class="decoracion">🌈 ✨ 🎈</span>
            <h1>¡Aprendamos a multiplicar!</h1>
            <p>Diviértete practicando las tablas de multiplicar</p>
        </header>

        <button class="boton-probar" onclick="generarTablas()">
            ⭐ PROBAR ⭐
        </button>

        <section class="tarjeta">
            <h2>🎨 Tabla del 3 🎨</h2>
            <p class="instruccion">¡Vamos a aprender jugando!</p>

            <div id="tabla" class="tabla">
                <div class="fila">
                    <span>3 × 1</span><span class="resultado">= 3</span>
                </div>
                <div class="fila">
                    <span>3 × 2</span><span class="resultado">= 6</span>
                </div>
                <div class="fila">
                    <span>3 × 3</span><span class="resultado">= 9</span>
                </div>
                <div class="fila">
                    <span>3 × 4</span><span class="resultado">= 12</span>
                </div>
                <div class="fila">
                    <span>3 × 5</span><span class="resultado">= 15</span>
                </div>
                <div class="fila">
                    <span>3 × 6</span><span class="resultado">= 18</span>
                </div>
                <div class="fila">
                    <span>3 × 7</span><span class="resultado">= 21</span>
                </div>
                <div class="fila">
                    <span>3 × 8</span><span class="resultado">= 24</span>
                </div>
                <div class="fila">
                    <span>3 × 9</span><span class="resultado">= 27</span>
                </div>
                <div class="fila">
                    <span>3 × 10</span><span class="resultado">= 30</span>
                </div>
            </div>
        </section>

        <footer>
            <p>💖 Creado por: Ari 💖</p>
            <p>¡Cada día aprendemos algo nuevo!</p>
        </footer>
    </main>

</body>
</html>
